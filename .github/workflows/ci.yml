name: CI

on:
  pull_request:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_padeliz_testing
          MYSQL_USER: db_user
          MYSQL_PASSWORD: db_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, redis, gd, bcmath, pcntl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan storage:link
          php artisan api:docs:generate-all

      - name: Run tests
        env:
          APP_ENV: testing
          CACHE_DRIVER: redis
          QUEUE_CONNECTION: sync
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: db_padeliz_testing
          DB_USERNAME: db_user
          DB_PASSWORD: db_pass
          DB_TESTING_HOST: 127.0.0.1
          DB_TESTING_PORT: 3306
          DB_TESTING_DATABASE: db_padeliz_testing
          DB_TESTING_USERNAME: db_user
          DB_TESTING_PASSWORD: db_pass
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test
