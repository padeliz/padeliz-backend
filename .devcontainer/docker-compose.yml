version: '3.8'

name: padeliz-backend

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: padeliz-backend-laravel
    restart: unless-stopped
    working_dir: /workspaces/padeliz-backend
    volumes:
      - ..:/workspaces/padeliz-backend:delegated
      - composer_cache:/root/.composer/cache
    environment:
      - TZ=Europe/Bucharest
      - DB_HOST=db
      - DB_PORT=3306
    networks:
      - backend-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: padeliz-backend-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ..:/workspaces/padeliz-backend:delegated
      - ../docker/nginx:/etc/nginx/conf.d/
    networks:
      - backend-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    container_name: padeliz-backend-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_padeliz
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_pass
      # Testing database configuration
      DB_TESTING_DATABASE: db_padeliz_testing
      DB_TESTING_USERNAME: db_user
      DB_TESTING_PASSWORD: db_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ../docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: padeliz-backend-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: db_user
      PMA_PASSWORD: db_pass
      PMA_ARBITRARY: 1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  backend-network:
    driver: bridge

volumes:
  mysql_data:
  composer_cache:
