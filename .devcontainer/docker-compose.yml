name: padeliz-backend

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: padeliz-backend-laravel
    restart: unless-stopped
    working_dir: /workspaces/padeliz-backend
    volumes:
      - ..:/workspaces/padeliz-backend:delegated
      - composer_cache:/root/.composer/cache
    environment:
      - TZ=Europe/Bucharest
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - CACHE_DRIVER=redis
    networks:
      - backend-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: padeliz-backend-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ..:/workspaces/padeliz-backend:delegated
      - ../docker/nginx:/etc/nginx/conf.d/
    networks:
      - backend-network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: padeliz-backend-redis
    restart: unless-stopped
    networks:
      - backend-network

  db:
    image: mysql:8.0
    container_name: padeliz-backend-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_padeliz
      MYSQL_USER: db_user
      MYSQL_PASSWORD: db_pass
      # Testing database configuration
      DB_TESTING_DATABASE: db_padeliz_testing
      DB_TESTING_USERNAME: db_user
      DB_TESTING_PASSWORD: db_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ../docker/mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: padeliz-backend-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: db_user
      PMA_PASSWORD: db_pass
      PMA_ARBITRARY: 1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional local Netopia IPN relay (sandbox only). Enabled via profile
  # netopia-ipn-relay when padeliz-netopia-ipn-relay exists and NETOPIA_IS_LIVE is not truthy.
  # See .devcontainer/scripts/sync-netopia-ipn-relay-profile
  netopia-ipn-relay:
    profiles: ["netopia-ipn-relay"]
    build:
      context: ../../padeliz-netopia-ipn-relay
      dockerfile: Dockerfile
    container_name: padeliz-backend-netopia-ipn-relay
    restart: on-failure
    env_file:
      - ../.env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - IPN_URL=http://nginx/api/v1/webhooks/netopia/ipn
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - backend-network
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
      nginx:
        condition: service_healthy

networks:
  backend-network:
    driver: bridge

volumes:
  mysql_data:
  composer_cache:
